services:
  # MongoDB Production Cluster / Instance
  mongo:
    image: mongo:7.0
    container_name: p2p_mongo_prod
    restart: always
    environment:
      MONGO_INITDB_DATABASE: p2p_lending_platform
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - p2p_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Session, Socket.io Adapter & Cache
  redis:
    image: redis:7-alpine
    container_name: p2p_redis_prod
    restart: always
    ports:
      - "6379:6379"
    networks:
      - p2p_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: p2p_backend_prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5050
      MONGODB_URI: mongodb://mongo:27017/p2p_lending_platform
      JWT_SECRET: ${JWT_SECRET:-production_secure_secret_p2p_fintech_2026}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost,http://localhost:80,http://localhost:5173
      PAYMENT_SIMULATION_MODE: ${PAYMENT_SIMULATION_MODE:-true}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_simulated_key}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-rzp_test_simulated_secret}
    ports:
      - "5050:5050"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - p2p_network

  # React Frontend (Nginx SPA)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: p2p_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - p2p_network

networks:
  p2p_network:
    driver: bridge

volumes:
  mongo_data:
